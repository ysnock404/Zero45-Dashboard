server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # docker embedded DNS, so backend name is resolved at request time
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 25m;

    # REST API -> backend
    location /api/ {
        set $backend http://zero45-dashboard-backend:9031;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Socket.IO (WebSocket + long-polling) -> backend
    location /socket.io/ {
        set $backend http://zero45-dashboard-backend:9031;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Don't buffer — long-poll responses must flush immediately, otherwise
        # the client's next poll overlaps the previous one and engine.io kills
        # the session with a 400 ("two concurrent GETs").
        proxy_buffering off;
    }

    # Health passthrough
    location = /health {
        set $backend http://zero45-dashboard-backend:9031;
        proxy_pass $backend;
    }

    # Content-hashed build assets are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA shell must never be cached, or clients keep running stale JS after a
    # deploy (which looked exactly like "the assistant page is broken").
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
